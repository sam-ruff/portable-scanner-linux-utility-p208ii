[package]
name = "p208ii"
version = "0.1.0"
edition = "2024"
description = "Linux driver and receipt scanning app for the Canon imageFORMULA P-208II"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sam-ruff/portable-scanner-linux-utility-p208ii"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
env_logger = "0.11.11"
iced = { version = "0.14.0", features = ["svg"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "tiff"] }
log = "0.4.34"
miniz_oxide = "0.9.1"
nusb = "0.2.7"
png = "0.18.1"
rfd = "0.17.2"
thiserror = "2.0.21"

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
mockall = "0.15.0"
tempfile = "3.27.0"
