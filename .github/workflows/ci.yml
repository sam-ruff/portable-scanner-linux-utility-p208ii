name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: [self-hosted, sophie]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  build:
    needs: check
    runs-on: [self-hosted, sophie]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test the command line
        run: |
          ./target/release/p208ii --version
          ./target/release/p208ii --simulate info
          ./target/release/p208ii --simulate scan --output "$RUNNER_TEMP/scans" --smart-crop --format pdf --duplex
          test "$(ls "$RUNNER_TEMP/scans" | wc -l)" -eq 3

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: p208ii-linux-x86_64
          path: target/release/p208ii
          if-no-files-found: error
